name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff>=0.12"

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install "mypy>=1.16" pydantic types-requests types-PyYAML
          pip install -r app/requirements.txt

      - name: Mypy
        run: mypy --config-file=pyproject.toml app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r app/requirements.txt

      - name: Build check
        run: ./scripts/build.sh --check

      - name: Python tests
        run: python -m pytest tests/ --timeout=60 -q

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: whep_proxy/go.mod

      - name: Go tests
        run: go test ./whep_proxy/... -v -count=1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the PR commit range; shallow history makes its base
          # revision unavailable and produces a false CI failure.
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for host-specific secrets
        run: |
          matches=$(grep -rInE '192\.168\.1\.|172\.30\.32\.|Cessna|ccab4aaf|0eb0428f|local_docker_wyze' \
            app/ scripts/ runtime_overlays/ home_assistant/ .ha_live_addon/ || true)
          # Allow the intentional HA ingress default (172.30.32.2) at web_ui.py:39 in app/ and generated trees
          if [ -n "$matches" ]; then
            matches=$(printf '%s\n' "$matches" | grep -vE 'web_ui\.py:39:.*172\.30\.32\.2' || true)
          fi
          if [ -n "$matches" ]; then
            echo "Host-specific patterns found:"
            echo "$matches"
            exit 1
          fi
          echo "No host-specific patterns found in app/, scripts/, runtime_overlays/, home_assistant/, .ha_live_addon/"
