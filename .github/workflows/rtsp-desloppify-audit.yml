name: RTSP fix and Desloppify audit

on:
  push:
    branches: [fix/rtsp-egress-health]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate packaged sidecar shell syntax
        run: |
          set -eux
          sh -n app/go2rtc_sidecar.sh
          sh -n home_assistant/app/go2rtc_sidecar.sh
          sh -n .ha_live_addon/app/go2rtc_sidecar.sh

      - name: Install project and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r app/requirements.txt
          python -m pip install --upgrade "desloppify[full]"

      - name: Apply deterministic branch fixes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          snapshot = Path('app/wyzebridge/snapshot.py')
          text = snapshot.read_text()
          old = 'from wyzebridge.mqtt import update_preview\n'
          new = 'from wyzebridge.mqtt import publish_topic, update_preview\n'
          if old not in text and new not in text:
              raise SystemExit('snapshot MQTT import shape changed unexpectedly')
          snapshot.write_text(text.replace(old, new))

          sidecar = Path('app/go2rtc_sidecar.sh')
          text = sidecar.read_text()
          helper = r'''
          restart_go2rtc_child() {
              _recovery_alias="${1:-unknown}"
              _cooldown_file=/tmp/go2rtc_recovery_last
              _cooldown="${GO2RTC_RECOVERY_COOLDOWN:-30}"
              _now=$(date +%s)
              _last=$(cat "${_cooldown_file}" 2>/dev/null | tr -cd '0-9')
              [ -z "${_last}" ] && _last=0
              if [ $((_now - _last)) -lt "${_cooldown}" ] 2>/dev/null; then
                  echo "[GO2RTC_RECOVERY] ${_recovery_alias}: child restart throttled (cooldown=${_cooldown}s)" >&2
                  return 0
              fi

              _signalled=0
              for _comm_file in /proc/[0-9]*/comm; do
                  [ -r "${_comm_file}" ] || continue
                  _comm=$(cat "${_comm_file}" 2>/dev/null || echo "")
                  [ "${_comm}" = "go2rtc" ] || continue
                  _pid=${_comm_file#/proc/}
                  _pid=${_pid%/comm}
                  if kill "${_pid}" 2>/dev/null; then
                      _signalled=$((_signalled + 1))
                  fi
              done

              if [ "${_signalled}" -gt 0 ]; then
                  echo "${_now}" > "${_cooldown_file}"
                  echo "[GO2RTC_RECOVERY] ${_recovery_alias}: signalled go2rtc child count=${_signalled}" >&2
              else
                  echo "[GO2RTC_RECOVERY] ${_recovery_alias}: no exact go2rtc child found" >&2
              fi
          }
          '''
          marker = '\nnormalize_go2rtc_config() {'
          if 'restart_go2rtc_child() {' not in text:
              if marker not in text:
                  raise SystemExit('sidecar insertion marker changed unexpectedly')
              text = text.replace(marker, '\n' + helper.strip() + '\n' + marker, 1)

          legacy = 'curl -sf -X POST "${GO2RTC_API_BASE}/api/streams?src=&dst=${alias}" >/dev/null 2>&1 || true'
          legacy_count = text.count(legacy)
          if legacy_count:
              text = text.replace(legacy, 'restart_go2rtc_child "${alias}"')
          if '/api/streams?src=&dst=' in text:
              raise SystemExit('legacy stream-to-camera POST restart call remains')
          sidecar.write_text(text)
          print(f'replaced legacy POST restart calls: {legacy_count}')

          watchdog_test = Path('tests/test_babysitter_watchdog.py')
          text = watchdog_test.read_text()
          text = text.replace(
              '            waited = wd._wait_for_recovery("doorbell", entry)\n        # Timeout reached; waited is based on poll intervals.\n',
              '            wd._wait_for_recovery("doorbell", entry)\n        # Timeout reached without reporting recovery.\n',
          )
          watchdog_test.write_text(text)

          snapshot_test = Path('tests/test_snapshot_health.py')
          text = snapshot_test.read_text()
          text = text.replace(
              '            patch.object(SM, "_restart_stream_for_snapshot") as mock_restart,\n',
              '            patch.object(SM, "_restart_stream_for_snapshot"),\n',
          )
          snapshot_test.write_text(text)
          PY
          sh -n app/go2rtc_sidecar.sh
          ruff check app/ tests/ --fix || true
          ruff format app/ tests/
          ./scripts/build.sh --apply home_assistant
          ./scripts/build.sh --apply ha_live_addon
          sh -n home_assistant/app/go2rtc_sidecar.sh
          sh -n .ha_live_addon/app/go2rtc_sidecar.sh

      - name: Run scoped Desloppify CI scans
        shell: bash
        run: |
          set -eux
          # Generated Home Assistant mirrors are build outputs of app/ and must
          # not count as independent source debt.
          desloppify exclude home_assistant
          desloppify exclude .ha_live_addon
          desloppify --lang python scan --path . --profile ci --no-badge
          desloppify --lang python status --json
          # whep_proxy is a separate Go program; scan it as its own project.
          desloppify --lang go scan --path ./whep_proxy --profile ci --no-badge
          desloppify --lang go status --json

      - name: Build check
        run: ./scripts/build.sh --check

      - name: Ruff check
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Python tests
        run: python -m pytest tests/ --timeout=60 -q

      - name: Commit deterministic cleanup
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo 'No deterministic cleanup changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests home_assistant .ha_live_addon
          git commit -m 'fix: remove invalid go2rtc alias restart path'
          git push origin HEAD:${GITHUB_REF_NAME}
