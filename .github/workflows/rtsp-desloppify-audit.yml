name: RTSP fix and Desloppify audit

on:
  push:
    branches: [fix/rtsp-egress-health]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate packaged sidecar shell syntax
        run: |
          set -eux
          sh -n app/go2rtc_sidecar.sh
          sh -n home_assistant/app/go2rtc_sidecar.sh
          sh -n .ha_live_addon/app/go2rtc_sidecar.sh

      - name: Install project and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r app/requirements.txt
          python -m pip install --upgrade "desloppify[full]"

      - name: Run scoped Desloppify CI scans
        shell: bash
        run: |
          set -eux
          # Generated Home Assistant mirrors are build outputs of app/ and must
          # not count as independent source debt.
          desloppify exclude home_assistant
          desloppify exclude .ha_live_addon
          desloppify --lang python scan --path . --profile ci --no-badge
          desloppify --lang python status --json
          # whep_proxy is a separate Go program; scan it as its own project.
          desloppify --lang go scan --path ./whep_proxy --profile ci --no-badge
          desloppify --lang go status --json

      - name: Build check
        run: ./scripts/build.sh --check

      - name: Python tests
        run: python -m pytest tests/ --timeout=60 -q
